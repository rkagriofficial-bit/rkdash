    // Cryptographic SHA-256 Digest Helper (with standard fallback)
    async function sha256(message) {
      if (!message) return "";
      try {
        if (window.crypto && window.crypto.subtle) {
          const msgBuffer = new TextEncoder().encode(message);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {
        console.warn("SubtleCrypto unavailable, using fallback hash", e);
      }
      return fallbackSha256(message);
    }

    function fallbackSha256(ascii) {
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      var mathPow = Math.pow; var maxWord = mathPow(2, 32); var lengthProperty = 'length';
      var i, j; var result = ''; var words = []; var asciiBitLength = ascii[lengthProperty] * 8;
      var hash = []; var k = []; var primeCounter = 0; var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
          hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16); var oldHash = hash; hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2]; var a = hash[0], e = hash[4];
          var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
          var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash); hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
      }
      for (i = 0; i < 8; i++) {
        for (var i2 = 3; i2 >= 0; i2--) {
          var c = (hash[i] >> (i2 * 8)) & 255;
          result += ((c < 16) ? '0' : '') + c.toString(16);
        }
      }
      return result;
    }

    // ================= MAIN COMPONENT =================
    function RKdashApp() {
      // Services Catalog State
      const [apps, setApps] = useState(() => {
        try {
          const saved = localStorage.getItem(CATALOG_STORAGE_KEY);
          return saved ? JSON.parse(saved) : INITIAL_SERVICES;
        } catch (e) {
          return INITIAL_SERVICES;
        }
      });

      // Authentication State
      const [authConfig, setAuthConfig] = useState(() => {
        try {
          const saved = localStorage.getItem(AUTH_STORAGE_KEY);
          return saved ? JSON.parse(saved) : DEFAULT_AUTH;
        } catch (e) {
          return DEFAULT_AUTH;
        }
      });

      // Session State (persists across page reloads in the current browser session)
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          return sessionStorage.getItem(SESSION_STORAGE_KEY) === "true";
        } catch (e) {
          return false;
        }
      });

      // UI States
      const [statusFilter, setStatusFilter] = useState('all');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('order');
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [adminTab, setAdminTab] = useState('list'); // 'list' | 'form' | 'security' | 'data'
      const [editingApp, setEditingApp] = useState(null);
      const [restrictedTargetApp, setRestrictedTargetApp] = useState(null);
      const [toast, setToast] = useState(null);

      // Search Keyboard Shortcut (Ctrl+K or /)
      const searchInputRef = useRef(null);
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            searchInputRef.current?.focus();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Persist Catalog
      useEffect(() => {
        try {
          localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(apps));
        } catch (e) {
          console.error("Failed to save catalog to localStorage", e);
        }
      }, [apps]);

      // Persist Auth
      useEffect(() => {
        try {
          localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(authConfig));
        } catch (e) {
          console.error("Failed to save auth to localStorage", e);
        }
      }, [authConfig]);

      // Show Toast Notification
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Authenticate Session
      const handleLoginSuccess = () => {
        setIsAuthenticated(true);
        try {
          sessionStorage.setItem(SESSION_STORAGE_KEY, "true");
        } catch (e) {}
        showToast(`Welcome back, ${authConfig.username}! Administrator session active.`);
      };

      // Sign Out Session
      const handleSignOut = () => {
        setIsAuthenticated(false);
        try {
          sessionStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (e) {}
        setIsAdminOpen(false);
        showToast("Administrator session signed out.", "info");
      };

      // Launch Service Handler
      const handleLaunch = (app) => {
        if (app.status === 'restricted') {
          if (isAuthenticated) {
            showToast(`Administrator Authorized: Launching ${app.title}`);
            window.open(app.targetUrl, '_blank');
          } else {
            setRestrictedTargetApp(app);
          }
        } else {
          window.open(app.targetUrl, '_blank');
        }
      };

      // Save/Edit Service
      const handleSaveApp = (formData) => {
        if (formData.id) {
          setApps(prev => prev.map(a => a.id === formData.id ? { ...a, ...formData } : a));
          showToast(`Service "${formData.title}" updated`);
        } else {
          const newApp = {
            ...formData,
            id: 'srv-' + Date.now().toString(36),
            order: Number(formData.order) || (apps.length + 1)
          };
          setApps(prev => [...prev, newApp]);
          showToast(`Service "${formData.title}" registered`);
        }
        setEditingApp(null);
        setAdminTab('list');
      };

      // Delete Service
      const handleDeleteApp = (id, title) => {
        if (window.confirm(`Are you sure you want to remove "${title}" from the gateway?`)) {
          setApps(prev => prev.filter(a => a.id !== id));
          showToast(`Service "${title}" removed from gateway`, 'info');
        }
      };

      // Reorder Services
      const handleMoveOrder = (id, delta) => {
        const sorted = [...apps].sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
        const index = sorted.findIndex(a => a.id === id);
        if (index === -1) return;
        const targetIndex = index + delta;
        if (targetIndex < 0 || targetIndex >= sorted.length) return;

        const temp = sorted[index].order;
        sorted[index].order = sorted[targetIndex].order;
        sorted[targetIndex].order = temp;

        sorted.sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
        sorted.forEach((item, i) => item.order = i + 1);

        setApps([...sorted]);
        showToast("Display order updated");
      };

      // Cycle Status Pill
      const handleCycleStatus = (id) => {
        setApps(prev => prev.map(a => {
          if (a.id === id) {
            const nextStatus = a.status === 'live' ? 'testing' : a.status === 'testing' ? 'restricted' : 'live';
            return { ...a, status: nextStatus };
          }
          return a;
        }));
        showToast("Deployment stage updated");
      };

      // Export / Import / Reset Catalog
      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps, null, 2));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `rkdash_gateway_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        showToast("Gateway catalog exported to JSON");
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {

        setIsVerifying(true);

    // ================= ADMIN LOGIN VIEW =================
    function AdminLoginView({ authConfig, onSuccess, onForgotPassword }) {
      const [username, setUsername] = useState(authConfig.username || 'admin');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [failedAttempts, setFailedAttempts] = useState(0);
      const [lockoutSeconds, setLockoutSeconds] = useState(0);

      // Lockout countdown timer
      useEffect(() => {
        if (lockoutSeconds > 0) {
          const timer = setTimeout(() => setLockoutSeconds(lockoutSeconds - 1), 1000);
          return () => clearTimeout(timer);
        }
      }, [lockoutSeconds]);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (lockoutSeconds > 0) return;

        setIsSubmitting(true);
        setError('');

        const passwordDigest = await sha256(password);
        const isUserMatch = username.trim().toLowerCase() === authConfig.username.toLowerCase();
        const isPassMatch = passwordDigest === authConfig.passwordHash;

        if (isUserMatch && isPassMatch) {
          setFailedAttempts(0);
          setIsSubmitting(false);
          onSuccess();
        } else {
          setIsSubmitting(false);
          const nextAttempts = failedAttempts + 1;
          setFailedAttempts(nextAttempts);

          if (nextAttempts >= 5) {
            setLockoutSeconds(30);
            setError('Too many failed attempts. Login temporarily locked for 30 seconds.');
          } else {
            setError(`Invalid username or password. (${5 - nextAttempts} attempts remaining)`);
          }
        }
      };

      return (
        <div className="p-8 text-center flex-1 flex flex-col items-center justify-center">
          <div className="w-12 h-12 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mb-3 shadow-xs">
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <h3 className="text-lg font-bold text-slate-900">Administrator Access Gateway</h3>
          <p className="text-xs text-slate-500 max-w-sm mt-1 mb-5">
            Enter your credentials to manage enterprise services, priorities, and routing rules.
          </p>

          <form onSubmit={handleLogin} className="w-full max-w-xs space-y-3 text-left">
            <div>
              <label className="block text-[11px] font-bold text-slate-700 mb-1">Username</label>
              <input
                type="text"
                placeholder="Username"
                value={username}
                onChange={(e) => { setUsername(e.target.value); setError(''); }}
                className="w-full px-3.5 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 font-mono"
                required
                disabled={lockoutSeconds > 0}
              />
            </div>

            <div>
              <label className="block text-[11px] font-bold text-slate-700 mb-1">Password</label>
              <div className="relative">
                <input
                  type={showPassword ? "text" : "password"}
                  placeholder="Password"
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setError(''); }}
                  className="w-full pl-3.5 pr-9 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  required
                  disabled={lockoutSeconds > 0}
                />
                <button
                  type="button"
                  onClick={() => setShowPassword(!showPassword)}
                  className="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600"
                >
                  {showPassword ? (
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                  ) : (
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                  )}
                </button>
              </div>
            </div>

            {error && (
              <p className="text-[11px] text-rose-500 font-semibold flex items-center gap-1">
                <svg className="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {error}
              </p>
            )}

            <button
              type="submit"
              disabled={isSubmitting || lockoutSeconds > 0}
              className="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-xs transition-all disabled:opacity-50"
            >
              {lockoutSeconds > 0 ? `Locked (${lockoutSeconds}s)` : isSubmitting ? 'Authenticating...' : 'Sign In to Gateway'}
            </button>

            <div className="pt-2 text-center">
              <button
                type="button"
                onClick={onForgotPassword}
                className="text-[11px] text-brand-600 hover:text-brand-800 font-bold transition-colors"
              >
                Forgot Password? / Recover Access
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ================= ADMIN RECOVERY VIEW =================
    function AdminRecoveryView({ authConfig, setAuthConfig, onSuccess, onBackToLogin, showToast }) {
      const [step, setStep] = useState('verify'); // 'verify' | 'reset'
      const [recoveryMethod, setRecoveryMethod] = useState('key'); // 'key' | 'question'
      const [recoveryKeyInput, setRecoveryKeyInput] = useState('');
      const [securityAnswerInput, setSecurityAnswerInput] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [error, setError] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      const handleVerifyRecovery = async (e) => {
        e.preventDefault();
        setIsVerifying(true);
        setError('');

        if (recoveryMethod === 'key') {
          const keyHash = await sha256(recoveryKeyInput.trim());
          if (keyHash === authConfig.recoveryKeyHash) {
            setStep('reset');
            setIsVerifying(false);
          } else {
            setError('Invalid Master Recovery Key. Please check your credentials.');
            setIsVerifying(false);
          }
        } else {
          const ansHash = await sha256(securityAnswerInput.trim().toLowerCase());
          if (ansHash === authConfig.securityAnswerHash) {
            setStep('reset');
            setIsVerifying(false);
          } else {
            setError('Incorrect security question answer.');
            setIsVerifying(false);
          }
        }
      };

      const handleResetPassword = async (e) => {
        e.preventDefault();
        if (newPassword.length < 6) {
          setError('Password must be at least 6 characters.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setError('Passwords do not match.');
          return;
        }

        const newHash = await sha256(newPassword);
        setAuthConfig(prev => ({
          ...prev,
          passwordHash: newHash,
          updatedAt: Date.now()
        }));

        showToast("Password reset successfully. Signed in.");
        onSuccess();
      };

      return (
        <div className="p-8 text-center flex-1 flex flex-col items-center justify-center">
          <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-3 shadow-xs">
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    // ================= ADMIN SECURITY TAB =================
    function AdminSecurityTab({ authConfig, setAuthConfig, showToast }) {
      // Change Password Form State
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [passError, setPassError] = useState('');

      // Change Username Form State
      const [newUsername, setNewUsername] = useState(authConfig.username);
      const [userMsg, setUserMsg] = useState('');

      // Recovery Key & Security Question
      const [showKey, setShowKey] = useState(false);
      const [questionInput, setQuestionInput] = useState(authConfig.securityQuestion || "What is your primary gateway domain?");
      const [answerInput, setAnswerInput] = useState('');

      const handlePasswordChange = async (e) => {
        e.preventDefault();
        setPassError('');

        const currentHash = await sha256(currentPass);
        if (currentHash !== authConfig.passwordHash) {
          setPassError('Current password is incorrect.');
          return;
        }
        if (newPass.length < 6) {
          setPassError('New password must be at least 6 characters.');
          return;
        }
        if (newPass !== confirmPass) {
          setPassError('New passwords do not match.');
          return;
        }

        const newHash = await sha256(newPass);
        setAuthConfig(prev => ({
          ...prev,
          passwordHash: newHash,
          updatedAt: Date.now()
        }));

        setCurrentPass('');
        setNewPass('');
        setConfirmPass('');
        showToast("Password updated successfully!");
      };

      const handleUsernameChange = (e) => {
        e.preventDefault();
        if (!newUsername.trim()) return;
        setAuthConfig(prev => ({ ...prev, username: newUsername.trim() }));
        setUserMsg('Username updated');
        setTimeout(() => setUserMsg(''), 2500);
      };

      const handleGenerateNewKey = async () => {
        const randStr = Array.from(crypto.getRandomValues(new Uint8Array(8)))
          .map(b => b.toString(36).padStart(2, '0').toUpperCase())
          .join('')
          .slice(0, 12);
        const newKey = `RKDASH-${randStr.slice(0, 4)}-${randStr.slice(4, 8)}-${randStr.slice(8, 12)}`;
        const newKeyHash = await sha256(newKey);

        setAuthConfig(prev => ({
          ...prev,
          recoveryKey: newKey,
          recoveryKeyHash: newKeyHash,
          updatedAt: Date.now()
        }));

        setShowKey(true);
        showToast("New Master Recovery Key generated!");
      };

      const handleSaveSecurityQuestion = async (e) => {
        e.preventDefault();
        if (!answerInput.trim()) return;

        const ansHash = await sha256(answerInput.trim().toLowerCase());
        setAuthConfig(prev => ({
          ...prev,
          securityQuestion: questionInput.trim(),
          securityAnswerHash: ansHash,
          updatedAt: Date.now()
        }));

        setAnswerInput('');
        showToast("Security question and answer updated!");
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          
          {/* Change Password Card */}
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
            <div className="border-b border-slate-100 pb-3">
              <h4 className="text-sm font-bold text-slate-900">Change Administrator Password</h4>
              <p className="text-xs text-slate-500">Update your gateway master password. Hashes are securely computed via client-side SHA-256.</p>
            </div>

            <form onSubmit={handlePasswordChange} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Current Password</label>
                <input
                  type="password"
                  placeholder="Enter current password"
                  value={currentPass}
                  onChange={(e) => { setCurrentPass(e.target.value); setPassError(''); }}
                  className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  required
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">New Password</label>
                  <input
                    type="password"
                    placeholder="Min 6 characters"
                    value={newPass}
                    onChange={(e) => { setNewPass(e.target.value); setPassError(''); }}
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Confirm New Password</label>
                  <input
                    type="password"
                    placeholder="Confirm password"
                    value={confirmPass}
                    onChange={(e) => { setConfirmPass(e.target.value); setPassError(''); }}
                    className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                    required
                  />
                </div>
              </div>

              {passError && (
                <p className="text-xs text-rose-500 font-semibold">{passError}</p>
              )}

              <button
                type="submit"
                className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-xs transition-all"
              >
                Update Password
              </button>
            </form>
          </div>

          {/* Master Recovery Key Management Card */}
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
            <div className="border-b border-slate-100 pb-3">
              <h4 className="text-sm font-bold text-slate-900">Master Recovery Key</h4>
              <p className="text-xs text-slate-500">
                Use this emergency key to reset your administrator password if lost. Store it in a safe password vault.
              </p>
            </div>

            <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
              <div className="font-mono text-xs font-bold text-slate-800 tracking-wider">
                {showKey ? (authConfig.recoveryKey || 'RKDASH-RECOVER-2026-KEY') : '••••••••••••••••••••••••'}
              </div>
              <div className="flex items-center space-x-2">
                <button
                  type="button"
                  onClick={() => setShowKey(!showKey)}
                  className="px-2.5 py-1 text-[11px] font-semibold bg-white border border-slate-300 rounded-lg hover:bg-slate-100 text-slate-700"
                >
                  {showKey ? 'Hide' : 'Reveal'}
                </button>
                <button
                  type="button"
                  onClick={() => {
                    navigator.clipboard.writeText(authConfig.recoveryKey || 'RKDASH-RECOVER-2026-KEY');
                    showToast("Recovery key copied to clipboard");
                  }}
                  className="px-2.5 py-1 text-[11px] font-semibold bg-white border border-slate-300 rounded-lg hover:bg-slate-100 text-slate-700"
                >
                  Copy
                </button>
              </div>
            </div>

            <div>
              <button
                type="button"
                onClick={handleGenerateNewKey}
                className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold transition-all"
              >
                Generate New Recovery Key
              </button>
            </div>
          </div>

          {/* Security Question Card */}
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
            <div className="border-b border-slate-100 pb-3">
              <h4 className="text-sm font-bold text-slate-900">Security Question Recovery</h4>
              <p className="text-xs text-slate-500">Secondary recovery method for identity validation.</p>
            </div>

            <form onSubmit={handleSaveSecurityQuestion} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Security Question</label>
                <input
                  type="text"
                  value={questionInput}
                  onChange={(e) => setQuestionInput(e.target.value)}
                  className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Secret Answer</label>
                <input
                  type="text"
                  placeholder="Set secret answer (stored hashed)"
                  value={answerInput}
                  onChange={(e) => setAnswerInput(e.target.value)}
                  className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  required
                />
              </div>

              <button
                type="submit"
                className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow-xs transition-all"
              >
                Save Security Question
              </button>
            </form>
          </div>

          {/* Username Settings Card */}
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
            <div className="border-b border-slate-100 pb-3">
              <h4 className="text-sm font-bold text-slate-900">Administrator Identity</h4>
              <p className="text-xs text-slate-500">Configure your administrator handle.</p>
            </div>

            <form onSubmit={handleUsernameChange} className="flex items-center gap-3">
              <input
                type="text"
                value={newUsername}
                onChange={(e) => setNewUsername(e.target.value)}
                className="flex-1 px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 font-mono"
                required
              />
              <button
                type="submit"
                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold transition-all"
              >
                Save Username
              </button>
              {userMsg && <span className="text-xs text-emerald-600 font-bold">{userMsg}</span>}
            </form>
          </div>

        </div>
      );
    }

    // ================= APP FORM COMPONENT =================

      const [description, setDescription] = useState(initialData ? initialData.description : '');

      const [order, setOrder] = useState(initialData ? initialData.order : totalCount + 1);
      const [status, setStatus] = useState(initialData ? initialData.status : 'live');

      const [icon, setIcon] = useState(initialData ? initialData.icon : 'chart');

        e.preventDefault();

          subdomain: subdomain.trim(),
          description: description.trim(),
          targetUrl: url,
          order: Number(order) || 1,
          status,
          category: category.trim() || 'General',
          icon,
          color
        });

            <button
              type="submit"
              className="px-5 py-2 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-700 text-white shadow-xs"
            >
              Save Service
            </button>
          </div>
        </form>
      );
    }

    // Helpers
    function extractDomain(url) {
      try {
        const parsed = new URL(url);
        return parsed.hostname + (parsed.pathname !== '/' ? parsed.pathname.substring(0, 15) : '');
      } catch (e) {
        return url ? url.substring(0, 25) : '';
      }
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RKdashApp />);
  </script>
</body>
</html>
